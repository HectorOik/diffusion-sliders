# Elastic-band hyperparameters for Flux 1 — Fast 5-Point Evaluation Mode.

elastic_band:
  # A strength is "valid" if its DreamSim distance to the unsteered reference is below this value.
  max_dreamsim_distance: 0.04

  # Probe up to 2 doubling steps to find minimum value dynamically for each image.
  max_doubling_steps: 2

  # Generate exactly 5 control points on the strength axis.
  starting_number_of_points: 5
  maximum_number_of_points: 5

  # Run 1 fast pass without refinement iterations.
  maximum_number_of_iterations: 1

  # Gap and movement thresholds
  target_gap: 0.01
  expand_threshold: 0.6
  lam: 1.0
  epsilon: 0.25
  move_fraction: 1.0
  base_step_fraction: 0.03
  min_meaningful_move: 0.5
  min_normalized_gap_for_move: 0.08
  min_gap_imbalance_for_move: 0.01

  # Generate all 5 images in 1 forward pass batch
  inference_batch_size: 5